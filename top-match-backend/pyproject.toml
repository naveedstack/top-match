[project]
name = "top-match-backend"
version = "0.1.0"
description = "Top Match backend API"
authors = [{ name = "naveedstack", email = "naveedur.tts@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
    "google-genai>=2.26.0",
    "tenacity>=9.1.4",
    "pypdfium2>=5.13.0",
    "pillow>=12.3.0",
    "pytesseract>=0.3.13",
    "slowapi>=0.1.10",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "langchain-google-genai>=4.4.0",
    "aioboto3>=15.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "mypy>=2.3.1",
    "pre-commit>=4.3.0",
    "reportlab>=5.0.1",
    "pypdf>=6.19.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"tests/**/*.py" = ["ASYNC240"]
"scripts/**/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "pypdfium2",
    "pypdfium2.*",
    "pytesseract",
    "slowapi",
    "slowapi.*",
    "pwdlib",
    "pwdlib.*",
    "aioboto3",
    "aioboto3.*",
    "botocore",
    "botocore.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
