name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "top-match-backend/**"
      - ".github/workflows/deploy-backend.yml"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::436624560263:role/github-action-topmatch
          aws-region: ap-south-1

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/topmatch-api:${{ github.sha }} -t $REGISTRY/topmatch-api:latest top-match-backend
          docker push $REGISTRY/topmatch-api:${{ github.sha }}
          docker push $REGISTRY/topmatch-api:latest

      - name: Restart the container
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-042c39cb0afb49dc9 \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["bash /home/ec2-user/deploy.sh"]' \
            --query Command.CommandId --output text)
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-042c39cb0afb49dc9